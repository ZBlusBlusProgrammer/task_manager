<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task Management System{% endblock %}</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Dark Purple Theme Styles -->
    <style>
        :root {
            --bs-dark-purple: #2b1055;
            --bs-deep-purple: #1a0833;
            --bs-accent-purple: #7928ca;
            --bs-neon-accent: #a855f7;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar-custom {
            background: linear-gradient(135deg, var(--bs-deep-purple), var(--bs-dark-purple));
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .navbar-custom .navbar-brand, 
        .navbar-custom .nav-link {
            color: #e2e8f0 !important;
            font-weight: 500;
        }

        .navbar-custom .nav-link:hover {
            color: var(--bs-neon-accent) !important;
        }

        .card {
            border: none;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
            border-radius: 0.75rem;
        }

        .btn-purple {
            background-color: var(--bs-accent-purple);
            color: white;
            border: none;
        }

        .btn-purple:hover {
            background-color: var(--bs-dark-purple);
            color: white;
        }

        footer {
            background-color: var(--bs-deep-purple);
            color: #a0aec0;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom px-4 mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fs-4" href="{% url 'tasks:task_list' %}">🚀 TaskManager</a>
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'tasks:task_list' %}">Tasks List</a>
                    </li>
                    <li class="nav-item ms-2">
                        <a class="btn btn-purple btn-sm px-3" href="{% url 'tasks:task_create' %}">+ New Task</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Global Toast Container -->
    <div aria-live="polite" aria-atomic="true" class="position-relative">
        <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container" style="z-index: 1055;">
            {% if messages %}
                {% for message in messages %}
                    <div class="toast align-items-center text-white bg-{% if message.tags == 'warning' %}warning{% elif message.tags == 'error' %}danger{% else %}success{% endif %} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
                        <div class="d-flex">
                            <div class="toast-body">
                                {{ message }}
                            </div>
                            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                        </div>
                    </div>
                {% endfor %}
            {% endif %}
        </div>
    </div>

    <!-- Main Content Block -->
    <main class="container flex-grow-1 my-3">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center py-3 mt-auto">
        <small>&copy; 2026 Task Management System | Powered by Django & Bootstrap</small>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Global JS for Toasts -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Auto-initialize toasts loaded from the Django backend
            const toastElList = document.querySelectorAll('.toast');
            const toastList = [...toastElList].map(toastEl => new bootstrap.Toast(toastEl, { delay: 4000 }));
            toastList.forEach(toast => toast.show());
        });

        // Reusable function to trigger frontend AJAX toasts dynamically
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const bgClass = type === 'success' ? 'bg-success' : 'bg-warning text-dark';
            
            const toastHTML = `
                <div class="toast align-items-center text-white ${bgClass} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="d-flex">
                        <div class="toast-body">${message}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', toastHTML);
            const newToast = container.lastElementChild;
            new bootstrap.Toast(newToast, { delay: 4000 }).show();
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
