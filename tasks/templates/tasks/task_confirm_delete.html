{% extends 'tasks/base.html' %}
{% block title %}Delete Task - TaskManager{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card p-5 shadow">
            <h3 class="text-danger mb-3">⚠️ Confirm Deletion</h3>
            <p class="lead">Are you sure you want to delete the task: <strong>"{{ object.title }}"</strong>?</p>
            <p class="text-muted small">This action cannot be undone.</p>
            <form method="POST" class="mt-3">
                {% csrf_token %}
                <a href="{% url 'tasks:task_list' %}" class="btn btn-secondary px-4 me-2">Cancel</a>
                <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
