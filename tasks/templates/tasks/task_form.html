{% extends 'tasks/base.html' %}
{% block title %}Task Form - TaskManager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4 shadow-sm">
            <h3 class="mb-3 fw-bold" style="color: #2b1055;">Manage Task</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'tasks:task_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-purple">Save Task</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
